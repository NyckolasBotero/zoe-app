<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: menu lateral retrátil em vidro à esquerda, barra superior com sino, conteúdo em cards translúcidos sobre fundo líquido.
   Identidade: verde, vermelho e branco. Cores extraídas da logo: verde #1D904F, vermelho #DD3326, preto e branco. */
:root{
  --verde:#1D904F; --verde-2:#0B6B35; --vermelho:#DD3326; --branco:#FFFFFF;
  --bg:#F1F8F3; --fg:#10241A; --muted:#566B5E; --glass:rgba(255,255,255,.68); --glass-2:rgba(255,255,255,.92);
  --line:rgba(16,36,26,.14); --field:rgba(255,255,255,.9); --shadow:0 8px 22px rgba(15,60,35,.10); --shadow-h:0 20px 44px rgba(15,60,35,.24);
  --blob1:#4CCB86; --blob2:#F58383; --on-accent:#FFFFFF;
  --f-d:'Bricolage Grotesque',system-ui,sans-serif; --f-b:'Figtree',system-ui,sans-serif; --sw:276px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08130D; --fg:#E8F3EC; --muted:#93AA9B; --glass:rgba(22,38,29,.62); --glass-2:rgba(26,44,34,.92);
  --line:rgba(232,243,236,.16); --field:rgba(10,22,15,.7); --shadow:0 8px 24px rgba(0,0,0,.4); --shadow-h:0 20px 46px rgba(0,0,0,.6);
  --blob1:#0F6F3E; --blob2:#8E2A2A; --verde:#2FB36E; --vermelho:#FF5446; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08130D; --fg:#E8F3EC; --muted:#93AA9B; --glass:rgba(22,38,29,.62); --glass-2:rgba(26,44,34,.92);
  --line:rgba(232,243,236,.16); --field:rgba(10,22,15,.7); --shadow:0 8px 24px rgba(0,0,0,.4); --shadow-h:0 20px 46px rgba(0,0,0,.6);
  --blob1:#0F6F3E; --blob2:#8E2A2A; --verde:#2FB36E; --vermelho:#FF5446; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:15px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--f-d);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,5vw,38px);font-weight:800}h2{font-size:22px;font-weight:800}h3{font-size:17px;font-weight:600}
p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;display:block}
.liquid{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;filter:url(#goo)}
.blob{position:absolute;border-radius:50%;opacity:.3;filter:blur(2px);animation:float 18s ease-in-out infinite}
.b1{width:46vmax;height:46vmax;background:var(--blob1);left:-12vmax;top:-10vmax}
.b2{width:34vmax;height:34vmax;background:var(--blob2);right:-10vmax;top:30vh;animation-delay:-6s;opacity:.35}
.b3{width:30vmax;height:30vmax;background:var(--blob1);left:30vw;bottom:-14vmax;animation-delay:-11s;opacity:.3}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vmax,3vmax) scale(1.08)}66%{transform:translate(-3vmax,5vmax) scale(.94)}}
.no-anim .blob,.no-anim *{animation:none!important}.no-anim *{transition:none!important}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
/* sidebar */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--sw);z-index:50;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-right:1px solid var(--line);transition:width .35s cubic-bezier(.3,1.3,.5,1),transform .3s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.minimg{width:100%%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;display:block;background:var(--glass-2)}
.lg{display:block;height:auto}.lg-d{display:none}:root[data-theme="dark"] .lg-l{display:none}:root[data-theme="dark"] .lg-d{display:block}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-l{display:none}:root:not([data-theme="light"]) .lg-d{display:block}}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--verde),var(--verde-2));display:grid;place-items:center;color:#fff;font-family:var(--f-d);font-weight:800;font-size:20px;position:relative;flex:none}
.logo::after{content:"";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--vermelho);border:2px solid var(--bg)}
.brand b{font-family:var(--f-d);font-size:17px;line-height:1.1}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.me{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--glass-2);border:1px solid var(--line)}
.av{position:relative;width:54px;height:54px;flex:none}
.av .pic{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,var(--verde),var(--vermelho));display:grid;place-items:center;color:#fff;font-family:var(--f-d);font-weight:800;font-size:22px;background-size:cover;background-position:center;overflow:hidden}
.av .pen{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--vermelho);color:#fff;border:2px solid var(--bg);display:grid;place-items:center;cursor:pointer;padding:0}
.me .nm{min-width:0;flex:1}.me .nm input{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);font-family:var(--f-d);font-weight:600;font-size:16px;padding:2px 0;outline:none}
.me .nm input:focus{border-color:var(--verde)}.me small{color:var(--muted);font-size:11px}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:3px;padding:4px 0;scrollbar-width:thin}
.nv{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:0;background:transparent;cursor:pointer;text-align:left;overflow:hidden;color:var(--fg);font-weight:500;white-space:nowrap;isolation:isolate;transition:color .2s}
.nv::before{content:"";position:absolute;left:22px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--verde);opacity:.18;transform:translate(-50%,-50%) scale(0);transition:transform .45s cubic-bezier(.2,1.4,.4,1);z-index:-1}
.nv:hover::before{transform:translate(-50%,-50%) scale(14)}
.nv.on{background:linear-gradient(90deg,var(--verde),var(--verde-2));color:#fff;box-shadow:0 8px 18px rgba(15,111,62,.35)}
.nv.on::before{display:none}.nv:hover .ic{transform:scale(1.15) rotate(-6deg)}.nv .ic{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.nv:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--vermelho);outline-offset:2px}
.side-foot{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.side-foot select{width:100%}
.collapsed{--sw:80px}.collapsed .brand b,.collapsed .brand small,.collapsed .nm,.collapsed .nv span,.collapsed .side-foot{display:none}.collapsed .me{justify-content:center;padding:8px 4px}
.main{margin-left:var(--sw);position:relative;z-index:1;transition:margin .35s cubic-bezier(.3,1.3,.5,1);min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 16px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top h3{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.ib:hover{transform:translateY(-2px) scale(1.06);box-shadow:var(--shadow-h)}
.ib .dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:9px;background:var(--vermelho);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.content{padding:20px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));max-width:none;width:100%;display:flex;flex-direction:column;gap:18px}
/* cards */
.card{background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;min-width:0}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.card.flat:hover{transform:none;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.grid.w{grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}.muted{color:var(--muted)}.sm{font-size:13px}
.hero{padding:26px;border-radius:28px;background:linear-gradient(135deg,var(--verde) 0%,var(--verde-2) 60%,color-mix(in srgb,var(--vermelho) 70%,var(--verde-2)) 130%);color:#fff;position:relative;overflow:hidden}
.hero p{opacity:.9;max-width:52ch}.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.14);animation:float 14s ease-in-out infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:10px 16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--verde),var(--verde-2));color:#fff;box-shadow:0 6px 14px rgba(15,111,62,.3);transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px rgba(15,111,62,.4)}.btn:active{transform:scale(.96)}
.btn.red{background:linear-gradient(135deg,var(--vermelho),#B02323);box-shadow:0 6px 14px rgba(176,35,35,.3)}.btn.ghost{background:var(--glass-2);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--verde) 16%,transparent);color:var(--verde-2);border:1px solid color-mix(in srgb,var(--verde) 30%,transparent)}
:root[data-theme="dark"] .chip{color:var(--verde)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{color:var(--verde)}}
.chip.r{background:color-mix(in srgb,var(--vermelho) 14%,transparent);color:var(--vermelho);border-color:color-mix(in srgb,var(--vermelho) 30%,transparent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;border-radius:18px;background:var(--glass);border:1px solid var(--line);scrollbar-width:none}
.tabs button{flex:none;position:relative;border:0;background:transparent;border-radius:14px;padding:9px 14px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--muted);overflow:hidden;isolation:isolate;transition:color .2s}
.tabs button::before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--verde);opacity:.2;transform:translate(-50%,-50%) scale(0);transition:transform .45s cubic-bezier(.2,1.4,.4,1);z-index:-1}
.tabs button:hover::before{transform:translate(-50%,-50%) scale(14)}.tabs button.on{background:var(--verde);color:#fff}.tabs button.on::before{display:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;font-weight:400;color:var(--fg)}
textarea{min-height:96px;resize:vertical}input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--verde)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}.form .full{grid-column:1/-1}
.sw{position:relative;width:46px;height:26px;flex:none;border-radius:13px;border:0;background:var(--line);cursor:pointer;transition:background .25s;padding:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.sw.on{background:var(--verde)}.sw.on::after{transform:translateX(20px)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.opt:last-child{border:0}.opt div{flex:1;min-width:0}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font-family:var(--f-d);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--muted)}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--verde),var(--verde-2))}
.tl{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}.tl::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .it{position:relative}.tl .it .pt{position:absolute;left:-34px;top:0;width:32px;height:32px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center}
.tl .it:nth-child(3n) .pt{background:var(--vermelho)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .h{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.cal button{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:var(--field);cursor:pointer;position:relative;padding:0;font-variant-numeric:tabular-nums;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.cal button:hover{transform:scale(1.1);border-color:var(--verde)}.cal button.hoje{border-color:var(--vermelho);font-weight:800}.cal button.sel{background:var(--verde);color:#fff}
.cal .dots{position:absolute;bottom:4px;left:0;right:0;display:flex;gap:3px;justify-content:center}.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--verde)}.cal .dots i.a{background:var(--vermelho)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--glass-2);border:1px solid var(--line);border-radius:24px;padding:22px;width:min(560px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.pop{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));width:min(380px,calc(100vw - 24px));z-index:70;max-height:75vh;overflow:auto;background:var(--glass-2);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-h);padding:14px;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}

/* ===== carregamento com versículos e feedbacks ===== */
#splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--verde) 22%,var(--bg)),var(--bg));transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
#splash .sp{max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
#splash .vs{min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px;transition:opacity .35s,transform .35s}
#splash .vs.off{opacity:0;transform:translateY(8px)}
#splash blockquote{margin:0;font-family:var(--f-d);font-size:clamp(19px,4.6vw,26px);line-height:1.4;font-weight:600}
#splash cite{font-style:normal;color:var(--vermelho);font-weight:700;letter-spacing:.04em}
#splash .pg{width:min(260px,70vw);height:5px;border-radius:5px;background:var(--line);overflow:hidden}
#splash .pg i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--verde),var(--vermelho));animation:spfill 4s linear infinite}
@keyframes spfill{from{width:0}to{width:100%}}
#topbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:250;background:linear-gradient(90deg,var(--verde),var(--vermelho));transition:width .35s,opacity .3s;opacity:0;pointer-events:none}
#topbar.on{opacity:1}
.toast{display:flex;align-items:center;gap:10px;animation:tin .3s cubic-bezier(.2,1.4,.4,1)}
.toast i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;flex:none;background:var(--verde);color:#fff}
.toast.err{background:var(--vermelho);color:#fff}.toast.err i{background:#fff;color:var(--vermelho)}
.toast.info i{background:var(--muted)}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
#offline{position:fixed;top:0;left:0;right:0;z-index:240;background:var(--vermelho);color:#fff;text-align:center;font-weight:600;padding:6px 12px;font-size:13px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
.ld{pointer-events:none;opacity:.8}
.ld::after{content:"";display:inline-block;width:14px;height:14px;margin-left:8px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;vertical-align:-2px}
.ib.ld::after,.heart.ld::after{margin:0 0 0 4px}
@keyframes spin{to{transform:rotate(360deg)}}
.done{animation:okp .8s}.fail{animation:shk .4s}
@keyframes okp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--verde) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){#splash .pg i{animation:none;width:100%}.ld::after{animation-duration:1.6s}.done,.fail{animation:none}}
.no-anim #splash .pg i,.no-anim .done,.no-anim .fail{animation:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;box-shadow:var(--shadow-h);max-width:calc(100vw - 32px)}
.pic-ph{aspect-ratio:16/9;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--verde) 70%,#fff),var(--verde-2));display:grid;place-items:center;color:#fff}
.pic-ph.r{background:linear-gradient(135deg,var(--vermelho),#8E1F1F)}

#cmpfb .r{display:flex;align-items:center;gap:10px;font-weight:600}#cmpfb .sp2{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--bg) 35%,transparent);border-top-color:var(--bg);animation:spin .8s linear infinite}
#cmpfb .bar{height:5px;border-radius:5px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}#cmpfb .bar i{display:block;height:100%;width:3%;border-radius:5px;background:var(--bg);transition:width .25s var(--e-out)}
.vcar{position:relative}.vtrack{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 8px;scroll-behavior:smooth}.vtrack::-webkit-scrollbar{display:none}.vcar .vc{flex:0 0 min(340px,78%);scroll-snap-align:start}.vcar .carb{opacity:0;transition:opacity var(--d-base)}.vcar:hover .carb,.vcar:focus-within .carb{opacity:1}
.vc{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--glass);border-radius:20px;padding:10px;color:var(--fg);cursor:pointer;font:inherit;transition:transform var(--d-base) var(--e-spring),box-shadow var(--d-base) var(--e-out)}.vc:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}.vc b{padding:0 4px 4px;line-height:1.3}
.vth{position:relative;display:block;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--verde),#0F3F26)}.vth img,.vth .vph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.vph{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.18),transparent 60%)}
.vpl{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;backdrop-filter:blur(4px);transition:transform var(--d-base) var(--e-spring),background var(--d-base)}.vc:hover .vpl{transform:scale(1.15);background:var(--vermelho)}
.vlive{display:inline-block;background:var(--vermelho);color:#fff;font-size:11px;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:99px;animation:livep 1.6s ease-in-out infinite}.vth .vlive{position:absolute;left:10px;top:10px}.vlive.off{background:rgba(0,0,0,.6);animation:none}@keyframes livep{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--vermelho) 28%,transparent)}}
.modal .box.wide{width:min(900px,100%)}.vplayer{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}.vplayer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}.chk input{width:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.pc{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--glass);border-radius:20px;overflow:hidden;transition:transform var(--d-base) var(--e-spring),box-shadow var(--d-base) var(--e-out)}.pc:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}.pc.off .pimg img,.pc.off .pph{opacity:.45}
.pimg{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,var(--verde),#0F3F26);display:grid;place-items:center}.pimg img{width:100%;height:100%;object-fit:cover}.pimg .vlive{position:absolute;left:10px;top:10px}.pph{display:grid;place-items:center;color:rgba(255,255,255,.85)}span.pph.sm{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--verde),#0F3F26);flex:none}
.pbody{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px;flex:1}.pbody .chip{align-self:flex-start}.pn{font-size:16px;line-height:1.25}.pd{margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.pv{font-size:22px;font-weight:800;color:var(--verde-2)}.pbody .btn{margin-top:auto}
.qty{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:99px;padding:2px}.qty button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--fg);font-size:18px;cursor:pointer}.qty button:hover{background:var(--glass-2)}.qty b{min-width:26px;text-align:center}
.subh{margin-top:8px;font-size:16px;font-weight:800}

const VERSOS=[{"t": "O ladrão não vem, senão para roubar, matar, e destruir; eu vim para que tenham vida, e a tenham em abundância.", "r": "João 10:10"}, {"t": "Porque Deus amou ao mundo de tal maneira, que deu o seu Filho unigênito; para que todo aquele que nele crê não pereça, mas tenha a vida eterna.", "r": "João 3:16"}, {"t": "O SENHOR é meu pastor, nada me faltará.", "r": "Salmos 23:1"}, {"t": "Posso todas as coisas em Cristo que me fortalece.", "r": "Filipenses 4:13"}, {"t": "Porque eu sei os pensamentos que penso quanto a vós, diz o SENHOR, pensamentos de paz, e não de mal, para vos dar um futuro com esperança.", "r": "Jeremias 29:11"}, {"t": "Não temas, porque eu estou contigo; não te assombres, porque eu sou teu Deus. Eu te fortaleço, te ajudo, e te sustento com a minha mão direita de justiça.", "r": "Isaías 41:10"}, {"t": "Confia no SENHOR com todo o teu coração; e não te apoies em teu próprio entendimento.", "r": "Provérbios 3:5"}, {"t": "E sabemos que todas as coisas juntamente contribuem para o bem daqueles que amam a Deus, dos que são chamados segundo o seu propósito.", "r": "Romanos 8:28"}, {"t": "Olha que te mando que te esforces e sejas valente: não temas nem desmaies, porque o SENHOR teu Deus será contigo onde quer que fores.", "r": "Josué 1:9"}, {"t": "Vinde a mim todos vós que estais cansados e sobrecarregados, e eu vos farei descansar.", "r": "Mateus 11:28"}, {"t": "Deus é nosso refúgio e força; socorro oportuno nas angústias.", "r": "Salmos 46:1"}, {"t": "Tua palavra é lâmpada para meus pés e luz para meu caminho.", "r": "Salmos 119:105"}, {"t": "E agora continuam a fé, a esperança, e o amor, estes três; porém o maior destes é o amor.", "r": "1 Coríntios 13:13"}];

function minArtKey(n){const t=String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const K=[['gourmet',/gourmet|cozinha|cafe|lanche|culinar|refeic|buffet/],['infantil',/infantil|kids|crianc|mirim|baby|bebe|berc/],['midia',/midia|video|foto|comunic|social|imagem|live|stream/],['musica',/music|louvor|worship|banda|vocal|coral|adora|instrument/],['som',/(^|\s)som(\s|$)|audio|sonoplast|mesa de som/],['limpeza',/limpez|zelad|conserv|higien/],['recepcao',/recepc|acolh|boas.?vindas|diacon|portaria|welcome/]];
 for(const [k,re] of K)if(re.test(t))return k;return 'geral'}
const minArtUrl=n=>MIN_ART[minArtKey(n)];
const minImg=i=>{const f=(S.minFotos||[])[i];return `<img class="minimg" src="${esc(f||minArtUrl(S.ministerios[i]))}" alt="${esc(S.ministerios[i])}" loading="lazy">`};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));let SP={i:0,tm:null,t0:0};
function splashShow(){if($('#splash'))return;const d=document.createElement('div');d.id='splash';d.setAttribute('role','status');d.setAttribute('aria-label','Carregando');d.innerHTML=`<div class="sp">${logoImg(190)}<div class="vs" id="sp_v"><blockquote id="sp_t"></blockquote><cite id="sp_r"></cite></div><div class="pg"><i></i></div><span class="muted sm">Carregando…</span></div>`;document.body.appendChild(d);SP.t0=Date.now();SP.i=Math.floor(Math.random()*VERSOS.length);splashVerso(true);SP.tm=setInterval(()=>{SP.i=(SP.i+1)%VERSOS.length;splashVerso()},4000)}
function splashVerso(first){const v=VERSOS[SP.i],el=$('#sp_v');if(!el)return;const set=()=>{$('#sp_t').textContent='“'+v.t+'”';$('#sp_r').textContent=v.r;el.classList.remove('off')};if(first)set();else{el.classList.add('off');setTimeout(set,350)}}
async function splashHide(min){const w=Math.max(0,(min||1500)-(Date.now()-SP.t0));if(w)await sleep(w);clearInterval(SP.tm);const d=$('#splash');if(d){d.classList.add('out');setTimeout(()=>d.remove(),500)}}
const TK='zoe-token';let TOKEN=null,READY=!ONLINE;try{TOKEN=localStorage.getItem(TK)}catch(e){}
let PEND=0,LASTB=null,LASTT=0,BARW=0;
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button,a.btn,label.btn');if(b){LASTB=b;LASTT=Date.now()}},true);
function topbar(){const b=$('#topbar');if(!b)return;if(PEND>0){b.classList.add('on');BARW=Math.min(90,BARW?BARW+(90-BARW)*.25:12);b.style.width=BARW+'%'}else{b.style.width='100%';setTimeout(()=>{if(!PEND){b.classList.remove('on');b.style.width='0';BARW=0}},300)}}
const CELL_ACTS=new Set(['cellMembers','history','indicators','getPapeis','savePapeis','saveCell','saveAttendance','lookup','addNewMember','requestTransfer','requestExit','createCellEvent','listPrayers','addPrayer']);
async function api(action,data){
  if(typeof S!=='undefined'&&S.celId&&CELL_ACTS.has(action)&&!(data&&data.celulaId))data=Object.assign({},data,{celulaId:S.celId});
  const btn=(LASTB&&Date.now()-LASTT<700&&document.contains(LASTB)&&!LASTB.disabled&&!LASTB.classList.contains('ld')&&!/^(list|get|me|birthdays|search|cellMembers|history|indicators|orgTree|fotos|lookup|track|usageReport)/.test(action))?LASTB:null;
  const usz=data?Object.values(data).reduce((a,v)=>a+(typeof v==='string'?v.length:0),0):0,big=usz>120000;if(big)upShow(usz);
  PEND++;topbar();const tm=setInterval(topbar,500);if(btn){btn.classList.add('ld');btn.setAttribute('aria-busy','true')}
  let okk=false;try{const r=await apiRaw(action,data);okk=true;return r}finally{PEND--;clearInterval(tm);topbar();if(big)upHide();if(btn){btn.classList.remove('ld');btn.removeAttribute('aria-busy');btn.classList.add(okk?'done':'fail');setTimeout(()=>btn.classList.remove('done','fail'),900)}}}
async function apiRaw(action,data){
  let res,tent=0;const leitura=/^(list|get|me|birthdays|search|cellMembers|history|indicators|orgTree|fotos|lookup|track|usageReport)/.test(action);
  for(;;){try{res=await fetch(ZC.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data:data||{},token:TOKEN}),redirect:'follow'});break}catch(e){if(leitura&&tent<2){await sleep(700*(++tent));continue}console.warn('[zoe] falha de rede em',action,e);throw new Error('Sem conexão com o servidor ('+action+'). Verifique a internet e tente de novo.')}}
  let j;try{j=await res.json()}catch(e){throw new Error('Resposta inesperada do servidor. Tente novamente.')}
  if(!j.ok){const er=j.error||{};const x=new Error(er.message||'Erro inesperado.');x.code=er.code;if(er.code==='SESSION'&&TOKEN&&action!=='logout')sair(true);throw x}
  return j.data}
async function push(a,d,ok){ok=ok||'Salvo com sucesso';if(!ONLINE){toast(ok);return null}try{const r=await api(a,d);toast(ok);return r}catch(e){toast(e.message,'err');return undefined}}
async function sair(expired){try{if(TOKEN&&!expired){await trkFlush();await api('logout')}}catch(e){}TOKEN=null;try{localStorage.removeItem(TK)}catch(e){}toLogin(expired?'Sessão expirada. Entre novamente.':'')}
function toLogin(msg){try{sessionStorage.setItem('zoe-msg',msg||'')}catch(e){}history.replaceState(null,'','#');location.reload()}
function showLogin(msg){READY=false;$('#layer').innerHTML='';$('#gate').innerHTML=`<div class="gate"><div class="gwrap">${logoImg(190)}<form class="gbox" onsubmit="return doLogin(event)"><h1 style="font-size:28px">${esc(ZC.nomeIgreja||'Ministério Zoe')}</h1><p class="muted">Entre com o e-mail e a senha cadastrados pela igreja.</p>${msg?`<p class="chip r" role="alert">${esc(msg)}</p>`:''}<label class="f">E-mail<input id="lg_e" type="email" autocomplete="username" required></label><label class="f">Senha<input id="lg_s" type="password" autocomplete="current-password" required></label><button class="btn" id="lg_b">Entrar</button></form></div></div>`}
async function doLogin(ev){ev.preventDefault();const b=$('#lg_b');b.disabled=true;try{const r=await api('login',{email:$('#lg_e').value,senha:$('#lg_s').value});TOKEN=r.token;try{localStorage.setItem(TK,TOKEN);sessionStorage.setItem('zoe-hello','1')}catch(e){}if(r.trocarSenha)showForced();else boot()}catch(e){showLogin(e.message)}return false}
function showForced(){$('#gate').innerHTML=`<div class="gate"><div class="gwrap">${logoImg(190)}<form class="gbox" onsubmit="return doForced(event)"><h2>Crie sua senha</h2><p class="muted">Por segurança, troque a senha temporária antes de continuar.</p><label class="f">Senha temporária<input id="fp_a" type="password" required></label><label class="f">Nova senha (8 ou mais caracteres)<input id="fp_n" type="password" minlength="8" required></label><label class="f">Repita a nova senha<input id="fp_r" type="password" required></label><button class="btn">Salvar nova senha</button></form></div></div>`}
async function doForced(ev){ev.preventDefault();if($('#fp_n').value!==$('#fp_r').value)return toast('As senhas não são iguais'),false;try{await api('changePassword',{atual:$('#fp_a').value,nova:$('#fp_n').value});TOKEN=null;try{localStorage.removeItem(TK)}catch(e){}toLogin('Senha alterada. Entre com a nova senha.')}catch(e){toast(e.message)}return false}
async function boot(){$('#gate').innerHTML='';splashShow();try{await hydrate();READY=true;shell();render();await splashHide();iniciaApos();hello()}catch(e){await splashHide(400);if(e.code!=='SESSION')showLogin(e.message)}}

/* ===== Bíblia (Almeida 1819 - domínio público), arquivos em assets/bible/ ===== */
const BIB={idx:null,cache:{},all:false,res:null,q:'',fs:0,msg:'',rc:{},codes:null};
/* versões: 'AL' = Almeida 1819 (arquivos locais, funciona offline); as demais são buscadas no serviço bolls.life na hora de ler */
const BVER={AL:{n:'Almeida 1819',c:null},ARC:{n:'ARC',c:'ARC'},ARA:{n:'ARA',c:'ARA'},NTLH:{n:'NTLH',c:'NTLH'},NVT:{n:'NVT',c:'NVT'}};
function bibPos(){S.bib=Object.assign({b:43,c:1,ver:'AL',cmp:false,ver2:'NVT',v1:0,v2:0},S.bib||{});if(!BVER[S.bib.ver])S.bib.ver='AL';if(!BVER[S.bib.ver2])S.bib.ver2='NVT';return S.bib}
const bibClean=h=>{const d=document.createElement('div');d.innerHTML=String(h||'').replace(/<br\s*\/?>/gi,' ').replace(/<(s|S)[^>]*>[^<]*<\/(s|S)>/g,'');return (d.textContent||'').replace(/\s+/g,' ').trim()};
/* devolve {nº do versículo: texto} do capítulo na versão pedida */
async function bibText(ver,b,c){
 if(ver==='AL'){const d=await bibBook(b),o={};(d[c-1]||[]).forEach((t,i)=>o[i+1]=t);return o}
 const k=ver+'|'+b+'|'+c;if(BIB.rc[k])return BIB.rc[k];
 try{const j=sessionStorage.getItem('zbib:'+k);if(j){BIB.rc[k]=JSON.parse(j);return BIB.rc[k]}}catch(e){}
 const r=await fetch('https://bolls.life/get-text/'+BVER[ver].c+'/'+b+'/'+c+'/');if(!r.ok)throw new Error('http '+r.status);
 const a=await r.json(),o={};if(!Array.isArray(a)||!a.length)throw new Error('vazio');a.forEach(x=>{o[x.verse]=bibClean(x.text)});if(Object.values(o).some(t=>t.length>900||/Biblica|bolls\.life|proibiu/i.test(t)))throw new Error('versão indisponível');BIB.rc[k]=o;try{sessionStorage.setItem('zbib:'+k,JSON.stringify(o))}catch(e){}return o}
function bibView(){const p=bibPos();
 if(!BIB.idx){bibLoadIdx();return '<div class="card flat"><h2>Bíblia</h2><p class="muted">Carregando…</p></div>'}
 if(BIB.idx==='erro')return `<div class="card flat col"><h2>Bíblia</h2><p class="muted">${BIB.msg||'Não foi possível carregar o texto.'}</p></div>`;
 const L=BIB.idx.livros,bk=L.find(x=>x.id===p.b)||L[42];
 const opt=t=>L.filter(x=>x.t===t).map(x=>`<option value="${x.id}" ${x.id===bk.id?'selected':''}>${esc(x.n)}</option>`).join('');
 const vo=k=>Object.keys(BVER).map(x=>`<option value="${x}" ${x===p[k]?'selected':''}>${esc(BVER[x].n)}</option>`).join('');
 const nv=BIB.nv||40,vs=(cur,vazio)=>`<option value="0" ${!cur?'selected':''}>${vazio}</option>`+Array.from({length:nv},(_,i)=>`<option value="${i+1}" ${cur===i+1?'selected':''}>${i+1}</option>`).join('');
 return `<div class="card flat col"><h2>Bíblia</h2>
 <div class="form"><label class="f">Versão<select id="bib_v" onchange="bibSet('ver',this.value)">${vo('ver')}</select></label>
 <label class="f">Livro<select id="bib_l" onchange="bibGo(+this.value,1)"><optgroup label="Antigo Testamento">${opt('OT')}</optgroup><optgroup label="Novo Testamento">${opt('NT')}</optgroup></select></label>
 <label class="f">Capítulo<select id="bib_c" onchange="bibGo(${bk.id},+this.value)">${Array.from({length:bk.c},(_,i)=>`<option ${i+1===p.c?'selected':''}>${i+1}</option>`).join('')}</select></label>
 <label class="f">Versículo (de)<select id="bib_v1" onchange="bibSet('v1',+this.value)">${vs(p.v1,'Todos')}</select></label>
 <label class="f">Versículo (até)<select id="bib_v2" onchange="bibSet('v2',+this.value)">${vs(p.v2,'Mesmo / fim')}</select></label></div>
 <div class="row"><label class="chk"><input type="checkbox" id="bib_cmp" ${p.cmp?'checked':''} onchange="bibSet('cmp',this.checked)"> Comparar com outra versão</label>${p.cmp?`<select id="bib_vv" onchange="bibSet('ver2',this.value)" aria-label="Versão para comparar">${vo('ver2')}</select>`:''}</div>
 <div class="row"><button class="btn sm ghost" onclick="bibNav(-1)">${ic('chev',14)} Anterior</button><button class="btn sm ghost" onclick="bibNav(1)">Próximo ${ic('chevr',14)}</button><span class="sp"></span><button class="btn sm ghost" onclick="bibFont(-1)" aria-label="Diminuir letra">A-</button><button class="btn sm ghost" onclick="bibFont(1)" aria-label="Aumentar letra">A+</button></div>
 <div class="row"><input id="bq" placeholder="Buscar palavra ou frase (texto Almeida 1819)" value="${esc(BIB.q)}" style="flex:1" onkeydown="if(event.key==='Enter')bibBusca()"><button class="btn" onclick="bibBusca()">Buscar</button></div></div>
 <div class="card flat" id="bibtxt">${BIB.res?bibRes():'<p class="muted">Carregando…</p>'}</div>
 <p class="muted sm">Almeida 1819: domínio público, funciona offline. ARC, ARA, NTLH e NVT são lidas do serviço bolls.life e precisam de internet; os textos pertencem aos respectivos detentores de direitos.</p>`}
function bibSet(k,v){const p=bibPos();p[k]=v;if(k==='v1'&&p.v2&&v&&p.v2<v)p.v2=0;BIB.res=null;save();if(k==='cmp'||k==='v1'||k==='ver'||k==='ver2'){render();bibShow()}else bibShow()}
async function bibLoadIdx(){if(BIB.loading)return;BIB.loading=1;try{const r=await fetch('assets/bible/index.json');if(!r.ok)throw 0;BIB.idx=await r.json()}catch(e){BIB.idx='erro';BIB.msg='O texto da Bíblia fica na pasta do site publicado (assets/bible). Abra o app pelo endereço oficial da igreja para ler.'}BIB.loading=0;if(R.r==='membro'&&R.sub.membro==='biblia'){render();if(BIB.idx!=='erro')bibShow()}}
async function bibBook(id){if(!BIB.cache[id]){const r=await fetch('assets/bible/'+id+'.json');if(!r.ok)throw new Error('Livro indisponível');BIB.cache[id]=await r.json()}return BIB.cache[id]}
async function bibShow(){const p=bibPos(),el=$('#bibtxt');if(!el||BIB.res)return;
 const vers=[p.ver].concat(p.cmp&&p.ver2!==p.ver?[p.ver2]:[]),ch=p.b+':'+p.c;
 try{const L=BIB.idx.livros.find(x=>x.id===p.b);
  const rs=await Promise.allSettled(vers.map(v=>bibText(v,p.b,p.c)));if(ch!==bibPos().b+':'+bibPos().c||!$('#bibtxt'))return;
  const ok=rs.map(r=>r.status==='fulfilled'?r.value:null);
  if(!ok.some(Boolean)){el.innerHTML='<p class="muted">Não foi possível carregar esta versão. Verifique a internet'+(p.ver!=='AL'?' ou troque para Almeida 1819 (funciona offline)':'')+'.</p>';return}
  const todos=[...new Set(ok.filter(Boolean).flatMap(o=>Object.keys(o).map(Number)))].sort((a,b)=>a-b),mx=todos[todos.length-1]||0;
  if(mx&&mx!==BIB.nv){BIB.nv=mx;const a=$('#bib_v1'),b=$('#bib_v2');if(a&&a.options.length-1!==mx){const f=(cur,vz)=>`<option value="0" ${!cur?'selected':''}>${vz}</option>`+Array.from({length:mx},(_,i)=>`<option value="${i+1}" ${cur===i+1?'selected':''}>${i+1}</option>`).join('');a.innerHTML=f(p.v1,'Todos');b.innerHTML=f(p.v2,'Mesmo / fim')}}
  const de=p.v1||1,ate=p.v1?(p.v2||p.v1):mx,lista=todos.filter(n=>n>=de&&n<=ate),sz=[16,18,21][BIB.fs+1]||18;
  const faixa=p.v1?(ate>de?':'+de+'-'+ate:':'+de):'';
  const tit=`<h3 style="margin-bottom:4px">${esc(L.n)} ${p.c}${faixa}</h3><p class="muted sm" style="margin:0 0 10px">${vers.map(v=>esc(BVER[v].n)).join(' | ')}</p>`;
  const linha=(n,v,i)=>{const t=ok[i]&&ok[i][n];return t?`<p style="margin:0 0 8px"><sup style="color:var(--vermelho);font-weight:700;margin-right:4px">${n}</sup>${esc(t)}${vers.length>1?` <b class="muted sm" style="white-space:nowrap">- ${esc(BVER[v].n)}</b>`:''}</p>`:(ok[i]===null?`<p class="muted sm" style="margin:0 0 8px">${n} - ${esc(BVER[v].n)}: indisponível (sem internet)</p>`:'')};
  el.innerHTML=tit+`<div style="font-size:${sz}px;line-height:1.7">${lista.length?lista.map(n=>vers.map((v,i)=>linha(n,v,i)).join('')).join(''):'<p class="muted">Versículo não encontrado neste capítulo.</p>'}</div>`}
 catch(e){el.innerHTML='<p class="muted">Não foi possível carregar este livro. Verifique a internet.</p>'}}
function bibGo(b,c){Object.assign(bibPos(),{b,c,v1:0,v2:0});BIB.res=null;BIB.nv=0;save();render();bibShow();scrollTo(0,0)}
function bibNav(d){const p=bibPos(),L=BIB.idx.livros;let i=L.findIndex(x=>x.id===p.b),c=p.c+d;if(c<1){if(i===0)return;i--;c=L[i].c}else if(c>L[i].c){if(i===L.length-1)return;i++;c=1}bibGo(L[i].id,c)}
function bibFont(d){BIB.fs=Math.max(-1,Math.min(1,BIB.fs+d));bibShow()}
const bibNorm=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
async function bibBusca(){const q=$('#bq').value.trim();BIB.q=q;if(q.length<3){toast('Digite ao menos 3 letras');return}
 const el=$('#bibtxt');el.innerHTML='<p class="muted">Buscando em toda a Bíblia…</p>';
 try{const L=BIB.idx.livros;await Promise.all(L.filter(x=>!BIB.cache[x.id]).map(x=>bibBook(x.id)));const n=bibNorm(q),out=[];
  for(const x of L){const d=BIB.cache[x.id];d.forEach((cap,ci)=>cap.forEach((t,vi)=>{if(out.length<80&&bibNorm(t).includes(n))out.push({b:x.id,n:x.n,c:ci+1,v:vi+1,t})}))}
  BIB.res=out;el.innerHTML=bibRes()}catch(e){el.innerHTML='<p class="muted">Não foi possível buscar. Verifique a internet.</p>'}}
function bibRes(){const r=BIB.res;return `<div class="row"><h3 class="sp">${r.length?r.length+(r.length>=80?'+':'')+' resultado(s)':'Nenhum resultado'}</h3><button class="btn sm ghost" onclick="BIB.res=null;render();bibShow()">Voltar à leitura</button></div>`+r.map((x,i)=>`<div class="opt" style="display:block"><b>${esc(x.n)} ${x.c}:${x.v}</b><div>${esc(x.t)}</div><button class="btn sm ghost" style="margin-top:6px" data-b="${x.b}" data-c="${x.c}" onclick="bibGo(+this.dataset.b,+this.dataset.c)">Ler capítulo</button></div>`).join('')}

function bellResume(){const p=$('#layer .pop');if(!p||BELL.on)return;BELL.on=true;BELL.start=Date.now();clearTimeout(BELL.t);BELL.t=setTimeout(bellFecha,BELL.left);const b=p.querySelector('.pbar');if(b)b.style.animationPlayState='running'}
function bellFecha(){clearTimeout(BELL.t);BELL.on=false;const p=$('#layer .pop');if(!p)return;if(!S.anim){closeL();return}p.classList.add('out');setTimeout(()=>{const q=$('#layer .pop');if(q&&q.classList.contains('out'))closeL()},220)}

 let b='';const h=S.historico;const tot=h.reduce((a,x)=>a+x.p,0);const media=h.length&&S.membros.length?Math.min(100,Math.round(tot/h.length/S.membros.length*100)):0;
 if(s==='freq')b=`<div class="grid"><div class="card"><div class="stat"><b>${S.membros.length}</b><span>Participantes</span></div></div><div class="card"><div class="stat"><b>${S.ind?S.ind.exParticipantes:(S.exN||3)}</b><span>Ex-participantes</span></div></div><div class="card"><div class="stat"><b>${S.ind?S.ind.reunioes:h.length+33}</b><span>Reuniões</span></div></div><div class="card"><div class="stat"><b>${S.ind?S.ind.presencaDeDeus:h.filter(x=>x.deus).length+16}</b><span>Presença de Deus</span></div></div></div>

 if(s==='papeis')b=`<div class="card flat col"><h2>Papéis</h2><p class="muted sm">Como funciona: escolha quem fica responsável por cada parte da reunião.</p><div class="tw"><table><tr><th>Membro</th>${PAPEIS.map(p=>`<th>${p}</th>`).join('')}</tr>${S.membros.map((m,i)=>`<tr><td><div class="row" style="flex-wrap:nowrap">${av(m.id,m.a,30)}<b>${esc(m.a)}</b></div></td>${PAPEIS.map((p,j)=>`<td><input type="checkbox" ${(S.papeis[i+'_'+j])?'checked':''} onchange="setPapel('${i}_${j}',this.checked)" style="width:20px;height:20px"></td>`).join('')}</tr>`).join('')}</table></div></div>`;
 if(s==='oracao')b=`<div class="card flat col"><h2>Pedir oração</h2><div class="f">Tema<div class="row" id="temas">${TEMAS.map((t,i)=>`<label class="chip" style="cursor:pointer"><input type="radio" name="tema" value="${i}" ${i===0?'checked':''} style="margin:0"> ${t}</label>`).join('')}</div></div>

 if(s==='ind')b=`<div class="card flat col"><h2>Indicadores da célula</h2><div class="row"><div class="stat"><b>${media}%</b><span>Presença média (últimas ${h.length} reuniões)</span></div></div><div class="bar"><i style="width:${media}%"></i></div></div>

 if(s==='membros')b=`<div class="row"><span class="sp muted sm">${S.membros.length} pessoa(s) na célula</span><button class="btn" onclick="go('celula','pres')">${ic('plus',16)} Adicionar pessoa</button></div><div class="grid">${S.membros.map(m=>`<div class="card col" style="align-items:center;text-align:center">${av(m.id,m.a,64)}<b>${esc(m.n)}</b><span class="muted sm">Apelido: ${esc(m.a)}</span><span class="sm">${ic('cake',14)} ${m.nasc.slice(0,5)}${idadeT(m.nasc)}</span><span class="chip ${m.m?'':'r'}">${m.m?'Membro':'Não é membro'}</span>${nv==='lider'||full?(saidaPend(m)?'<span class="chip r">Saída aguardando supervisor</span>':`<button class="btn ghost sm" onclick="saidaModal(${S.membros.indexOf(m)})">Informar saída</button>`):''}</div>`).join('')}</div>`;
 if(s==='perfilc')b=`<div class="card flat col"><h2>Perfil da célula</h2><div class="row"><div class="av" style="width:90px;height:90px"><div class="pic" style="border-radius:24px;font-size:36px;${S.cell.foto?`background-image:url('${S.cell.foto}')`:''}">${S.cell.foto?'':esc(S.cell.nome[0])}</div></div><label class="btn ghost">${ic('camera',18)} Trocar foto<input type="file" accept="image/*" hidden onchange="lerFoto(this,'cell')"></label></div>

 if(s==='priv')b=`<div class="card flat"><h2 style="margin-bottom:6px">Privacidade da célula</h2><p class="muted sm">Define o que aparece na busca por célula.</p>${[['grupo','Mostrar grupo em busca por célula'],['tel','Mostrar telefone do líder em busca por célula'],['email','Mostrar e-mail do líder em busca por célula'],['end','Mostrar endereço do grupo em busca por célula']].map(([k,t])=>`<div class="opt"><div>${t}</div>${sw(S.cell.priv[k],`togPriv('${k}')`)}</div>`).join('')}</div>`;

 if(s==='hist'){const ex=(S.ind&&S.ind.exNomes)||[];b=`<div class="card flat col"><h2>Histórico de presença</h2>${h.length?h.map(x=>{x.np=x.np||[];x.na=x.na||[];x.dia=x.dia||diaDe(x.d);const tt=Math.max(x.p,x.np.length+x.na.length||S.membros.length||1);return `<details class="opt" style="display:block"><summary style="cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:150px"><b>${fmt(x.d)} · ${esc(x.dia)}</b>${x.fora?' <span class="chip r">Fora do dia da célula</span>':''}<div class="muted sm">${x.p} de ${tt} presentes ${x.deus?'· Presença de Deus':''}</div></div><div style="width:35%;min-width:90px"><div class="bar"><i style="width:${Math.min(100,Math.round(x.p/tt*100))}%"></i></div></div></summary><div class="col" style="margin-top:10px;gap:6px">${x.np.length||x.na.length?`<div class="sm"><b>Presentes:</b> ${x.np.length?x.np.map(esc).join(', '):'ninguém'}</div><div class="sm"><b>Ausentes:</b> ${x.na.length?x.na.map(esc).join(', '):'ninguém'}</div>`:'<div class="muted sm">Sem lista de nomes para esta reunião.</div>'}</div></details>`}).join(''):'<p class="muted sm">Nenhuma reunião registrada ainda.</p>'}</div>${ex.length?`<div class="card flat col"><h3>Ex-participantes</h3><p class="muted sm">Saíram da congregação (informado pelo líder e aprovado pelo supervisor).</p>${ex.map(x=>`<div class="opt"><div><b>${esc(x.nome)}</b><div class="muted sm">${x.data?fmt(String(x.data).slice(0,10)):''} ${x.motivo?'· '+esc(x.motivo):''}</div></div></div>`).join('')}</div>`:''}`}
 if(s==='mural')b=muralHTML();

// reduz a foto até caber no limite de uma célula da planilha (~44 mil caracteres), mantendo a maior qualidade possível
function redimMax(f,cb,lim){lim=lim||44000;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{for(const w of [900,760,640,520,420,340,280]){const k=Math.min(1,w/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);for(const q of [.8,.68,.56,.45]){const d=c.toDataURL('image/jpeg',q);if(d.length<=lim)return cb(d)}}toast('Não foi possível reduzir esta foto. Escolha outra.','err')};im.onerror=()=>toast('Não foi possível ler a imagem','err');im.src=r.result};r.readAsDataURL(f)}
function redim(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.onerror=()=>toast('Não foi possível ler a imagem');im.src=r.result};r.readAsDataURL(f)}

function distKm(a,b,c,d){const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))}
const gmaps=c=>c.lat!=null?`https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.local||(c.bairro+', '+c.cid+' '+c.uf))}`;

 fl.forEach(c=>{c.d=S.pos&&c.lat!=null?distKm(S.pos.lat,S.pos.lng,c.lat,c.lng):null});
 const ord=f.ord||(S.pos?'dist':'dia'),di=DIAS;fl.sort((a,b)=>ord==='dist'?(a.d==null)-(b.d==null)||a.d-b.d:ord==='dia'?di.indexOf(a.dia)-di.indexOf(b.dia):ord==='ini'?a.ini.localeCompare(b.ini):a.cat.localeCompare(b.cat));return fl}

  it.z=Math.max(0,...S.muralItems.map(z=>z.z||0))+1;el.style.zIndex=3+it.z;const sx=e.clientX,sy=e.clientY;el.setPointerCapture(e.pointerId);
  if(e.target.closest('.rz')){const w0=el.offsetWidth;el.onpointermove=ev=>{it.w=Math.max(50,Math.min(560,Math.round(w0+(ev.clientX-sx)+(ev.clientY-sy)*(it.t==='p'?0.4:1))));if(it.t==='p')el.style.width=it.w+'px';else{const sv=el.querySelector('svg');sv.setAttribute('width',it.w);sv.setAttribute('height',it.w)}};
   el.onpointerup=()=>{el.onpointermove=null;el.onpointerup=null;save()};return}
  const ox=it.x,oy=it.y;
  el.onpointermove=ev=>{it.x=ox+ev.clientX-sx;it.y=oy+ev.clientY-sy;el.style.left=it.x+'px';el.style.top=it.y+'px'};
  el.onpointerup=()=>{el.onpointermove=null;el.onpointerup=null;save()}}})}
function svgImg(it,w){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${w}" viewBox="0 0 24 24" style="color:${it.c}">${STK[it.k].replace(/currentColor/g,it.c)}</svg>`)})}
function imgLoad(src){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src})}
// monta uma imagem PNG do mural, igual ao que aparece na tela, para salvar ou enviar no grupo da igreja
async function muralPNG(){const b=$('#board');if(!b)return null;const sc=2,W=b.clientWidth,H=b.clientHeight,c=document.createElement('canvas');c.width=W*sc;c.height=H*sc;const x=c.getContext('2d');x.scale(sc,sc);
 x.fillStyle='#24382C';x.fillRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.07)';for(let i=9;i<W;i+=18)for(let j=9;j<H;j+=18)x.fillRect(i,j,1.2,1.2);
 try{x.drawImage($('#cv'),0,0,W,H)}catch(e){}
 const els=[...b.querySelectorAll('.it2')].sort((p,q)=>(+p.style.zIndex||0)-(+q.style.zIndex||0));
 for(const el of els){const it=S.muralItems.find(z=>z.id===+el.dataset.id);if(!it)continue;const w=el.offsetWidth,h=el.offsetHeight;x.save();x.translate(it.x+w/2,it.y+h/2);x.rotate((it.r||0)*Math.PI/180);x.translate(-w/2,-h/2);
  if(it.t==='p'){x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=14;x.shadowOffsetY=6;x.fillStyle='#fff';x.fillRect(0,0,w,h);x.shadowColor='transparent';
   const ie=el.querySelector('.im'),ox=ie.offsetLeft,oy=ie.offsetTop,iw=ie.offsetWidth,ih=ie.offsetHeight;
   if(it.img){const im=await imgLoad(it.img);if(im)x.drawImage(im,ox,oy,iw,ih)}else{const g=x.createLinearGradient(ox,oy,ox+iw,oy+ih);g.addColorStop(0,it.c);g.addColorStop(1,'#0F6F3E');x.fillStyle=g;x.fillRect(ox,oy,iw,ih)}
   x.fillStyle='#222';x.font='11px system-ui,sans-serif';x.textAlign='center';x.fillText(String(it.l||'').slice(0,40),w/2,h-8)}
  else{const im=await svgImg(it,Math.round(w*sc));if(im)x.drawImage(im,0,0,w,h)}
  x.restore()}
 return await new Promise(r=>c.toBlob(r,'image/png'))}
async function compartilharMural(){toast('Preparando a imagem do mural…');const blob=await muralPNG();if(!blob)return toast('Não foi possível gerar a imagem','err');
 const nome='mural-'+String(S.cell.nome||'celula').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-')+'.png',file=new File([blob],nome,{type:'image/png'}),url=URL.createObjectURL(blob);window._muralFile=file;window._muralUrl=url;
 const podeShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
 modal(`<h2>Mural pronto</h2><img src="${url}" alt="Mural da célula" style="width:100%;border-radius:14px;border:1px solid var(--line)"><div class="row">${podeShare?`<button class="btn" onclick="muralEnviar()">${ic('share',16)} Compartilhar no grupo</button>`:''}<a class="btn ${podeShare?'ghost':''}" href="${url}" download="${nome}" onclick="toast('Imagem salva no seu aparelho')">Salvar imagem</a><button class="btn ghost" onclick="closeL()">Fechar</button></div><p class="muted sm">${podeShare?'Toque em Compartilhar e escolha o grupo da igreja no WhatsApp.':'Salve a imagem e envie no grupo da igreja.'}</p>`)}
async function muralEnviar(){try{await navigator.share({files:[window._muralFile],title:'Mural da célula '+S.cell.nome,text:'Mural da célula '+S.cell.nome+' · Ministério Zoe'});toast('Mural compartilhado')}catch(e){if(!e||e.name!=='AbortError')toast('Não foi possível compartilhar. Use Salvar imagem.','err')}}

const SEC={secs:[],raf:0};
function admMenu(){const v=$('#view'),sn=$('#subnav');let fab=$('#secfab');
 if(!v||R.r!=='admin'||v.dataset.r!=='admin'){SEC.secs=[];if(sn){sn.classList.remove('open');sn.innerHTML=''}if(fab)fab.remove();const p=$('#secpop');if(p)p.remove();return}
 const secs=[];[...v.children].forEach((c,i)=>{if(i===0)return;c.querySelectorAll(':scope > h2, :scope > h3').forEach((h,j)=>{const t=h.textContent.trim();if(!t)return;if(!h.id)h.id='sec-'+i+'-'+j;secs.push({id:h.id,t})})});SEC.secs=secs;
 const li=secs.map(x=>`<button class="sn" data-id="${x.id}" onclick="admGo('${x.id}')">${esc(x.t)}</button>`).join('');
 if(sn){const abriu=!sn.innerHTML;sn.innerHTML=li;sn.classList.toggle('open',!!secs.length);if(abriu&&secs.length)setTimeout(()=>{const n=$('.nav'),bt=sn.previousElementSibling;if(n&&bt)n.scrollTo({top:Math.max(0,bt.offsetTop-n.offsetTop-6),behavior:S.anim?'smooth':'auto'})},650)}
 if(!secs.length){if(fab)fab.remove();return}
 if(!fab){fab=document.createElement('button');fab.id='secfab';fab.className='btn';fab.setAttribute('aria-haspopup','true');fab.onclick=admFab;document.body.appendChild(fab)}fab.innerHTML=`${ic('menu',18)} Seções`;admSpy()}
function admGo(id){const h=document.getElementById(id);if(!h)return;menu(false);const p=$('#secpop');if(p)p.remove();h.scrollIntoView({behavior:S.anim?'smooth':'auto',block:'start'});const c=h.closest('.card')||h;c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1600)}
function admFab(){let p=$('#secpop');if(p){p.remove();return}p=document.createElement('div');p.id='secpop';p.className='ctxm';p.setAttribute('role','menu');p.innerHTML=SEC.secs.map(x=>`<button role="menuitem" onclick="admGo('${x.id}')">${esc(x.t)}</button>`).join('');document.body.appendChild(p);
 const close=e=>{if(!e.target.closest||(!e.target.closest('#secpop')&&!e.target.closest('#secfab'))){const q=$('#secpop');if(q)q.remove();document.removeEventListener('pointerdown',close,true)}};setTimeout(()=>document.addEventListener('pointerdown',close,true),0)}
function admSpy(){if(R.r!=='admin')return;let cur='';SEC.secs.forEach(x=>{const h=document.getElementById(x.id);if(h&&h.getBoundingClientRect().top<=140)cur=x.id});if(!cur&&SEC.secs[0])cur=SEC.secs[0].id;document.querySelectorAll('#subnav .sn').forEach(b=>b.classList.toggle('on',b.dataset.id===cur));const a=document.querySelector('#subnav .sn.on');const n=$('.nav');if(a&&n){const r=a.getBoundingClientRect(),q=n.getBoundingClientRect();if(r.top<q.top+30||r.bottom>q.bottom-30)n.scrollTo({top:n.scrollTop+(r.top-q.top)-q.height/2,behavior:'smooth'})}}
addEventListener('scroll',()=>{if(R.r!=='admin'||SEC.raf)return;SEC.raf=requestAnimationFrame(()=>{SEC.raf=0;admSpy()})},{passive:true});

document.addEventListener('pointerdown',e=>{if(!S.anim)return;const t=e.target.closest&&e.target.closest('.btn,.ib,.nv,.tabs button');if(!t||t.disabled)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,s=document.createElement('span');s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(s);setTimeout(()=>s.remove(),750)},true);
(function(){let last=0,tgt=0,cur=0,raf=0;const top=()=>document.querySelector('.top');
 function tick(){cur+=(tgt-cur)*.14;const b=$('#sprog');if(b)b.style.transform=`scaleX(${cur.toFixed(4)})`;if(Math.abs(tgt-cur)>.001)raf=requestAnimationFrame(tick);else raf=0}
 addEventListener('scroll',()=>{const y=scrollY,h=top();if(h){h.classList.toggle('scrolled',y>8);const dn=y>last&&y>140&&!document.body.classList.contains('menu-open');h.classList.toggle('hide',dn&&S.anim)}last=y;const m=document.documentElement.scrollHeight-innerHeight;tgt=m>0?Math.min(1,y/m):0;if(!raf)raf=requestAnimationFrame(tick)},{passive:true})})();

 if(!RVIO)RVIO=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;RVIO.unobserve(en.target);en.target.classList.add('in');setTimeout(()=>en.target.classList.remove('rv','in'),700)}),{rootMargin:'0px 0px -6% 0px'});
