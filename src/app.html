<style>
/* Layout: menu lateral retrátil em vidro à esquerda, barra superior com sino, conteúdo em cards translúcidos sobre fundo líquido.

:root{

  --blob1:#4CCB86; --blob2:#F58383; --on-accent:#FFFFFF;
  --f-d:'Bricolage Grotesque',system-ui,sans-serif; --f-b:'Figtree',system-ui,sans-serif; --sw:276px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08130D; --fg:#E8F3EC; --muted:#93AA9B; --glass:rgba(22,38,29,.62); --glass-2:rgba(26,44,34,.92);
  --line:rgba(232,243,236,.16); --field:rgba(10,22,15,.7); --shadow:0 8px 24px rgba(0,0,0,.4); --shadow-h:0 20px 46px rgba(0,0,0,.6);
  --blob1:#0F6F3E; --blob2:#8E2A2A; --verde:#2FB36E; --vermelho:#FF5446; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08130D; --fg:#E8F3EC; --muted:#93AA9B; --glass:rgba(22,38,29,.62); --glass-2:rgba(26,44,34,.92);
  --line:rgba(232,243,236,.16); --field:rgba(10,22,15,.7); --shadow:0 8px 24px rgba(0,0,0,.4); --shadow-h:0 20px 46px rgba(0,0,0,.6);
  --blob1:#0F6F3E; --blob2:#8E2A2A; --verde:#2FB36E; --vermelho:#FF5446; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:15px;line-height:1.5;overflow-x:hidden}

.ic{flex:none;display:block}

.blob{position:absolute;border-radius:50%;opacity:.3;filter:blur(2px);animation:float 18s ease-in-out infinite}
.b1{width:46vmax;height:46vmax;background:var(--blob1);left:-12vmax;top:-10vmax}

.b3{width:30vmax;height:30vmax;background:var(--blob1);left:30vw;bottom:-14vmax;animation-delay:-11s;opacity:.3}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vmax,3vmax) scale(1.08)}66%{transform:translate(-3vmax,5vmax) scale(.94)}}
.no-anim .blob,.no-anim *{animation:none!important}.no-anim *{transition:none!important}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
/* sidebar */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--sw);z-index:50;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-right:1px solid var(--line);transition:width .35s cubic-bezier(.3,1.3,.5,1),transform .3s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.lg{display:block;height:auto}.lg-d{display:none}:root[data-theme="dark"] .lg-l{display:none}:root[data-theme="dark"] .lg-d{display:block}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-l{display:none}:root:not([data-theme="light"]) .lg-d{display:block}}

.side-foot select{width:100%}

.main{margin-left:var(--sw);position:relative;z-index:1;transition:margin .35s cubic-bezier(.3,1.3,.5,1);min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 16px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top h3{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.ib:hover{transform:translateY(-2px) scale(1.06);box-shadow:var(--shadow-h)}
.ib .dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:9px;background:var(--vermelho);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.content{padding:20px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));max-width:1120px;display:flex;flex-direction:column;gap:18px}
/* cards */
.card{background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;min-width:0}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}

.chip.r{background:color-mix(in srgb,var(--vermelho) 14%,transparent);color:var(--vermelho);border-color:color-mix(in srgb,var(--vermelho) 30%,transparent)}

.tabs button:hover::before{transform:translate(-50%,-50%) scale(14)}.tabs button.on{background:var(--verde);color:#fff}.tabs button.on::before{display:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;font-weight:400;color:var(--fg)}

.stat{display:flex;flex-direction:column;gap:2px}.stat b{font-family:var(--f-d);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--muted)}

.tl{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}.tl::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--line)}

.tl .it:nth-child(3n) .pt{background:var(--vermelho)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .h{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}

.pic-ph{aspect-ratio:16/9;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--verde) 70%,#fff),var(--verde-2));display:grid;place-items:center;color:#fff}

.mini{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--verde),var(--verde-2));color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-d)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td select{min-width:120px;padding:6px 8px}

const logoImg=(w)=>`<img class="lg lg-l" src="${LOGO_L}" width="${w}" alt="Zoe - Vida de Deus"><img class="lg lg-d" src="${LOGO_D}" width="${w}" alt="Zoe - Vida de Deus">`;
const YT_URL="https://youtube.com/@zoe.digital.1";
const ZC=window.ZOE_CONFIG||{};const ONLINE=!!ZC.apiUrl;
const HOJE=ONLINE?new Date():new Date(2026,9,27);
const pad2=n=>String(n).padStart(2,'0');const isoD=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;const TODAY=isoD(HOJE);
const ROLES=[['admin','Administrador'],['pastor','Pastor'],['supervisor','Supervisor'],['lider','Líder de célula'],['membro','Membro']];const ROLE_N=Object.fromEntries(ROLES);
const TK='zoe-token';let TOKEN=null,READY=!ONLINE;try{TOKEN=localStorage.getItem(TK)}catch(e){}
async function api(action,data){
  let res;try{res=await fetch(ZC.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data:data||{},token:TOKEN}),redirect:'follow'})}catch(e){throw new Error('Sem conexão com o servidor. Verifique a internet.')}
  let j;try{j=await res.json()}catch(e){throw new Error('Resposta inesperada do servidor. Tente novamente.')}
  if(!j.ok){const er=j.error||{};const x=new Error(er.message||'Erro inesperado.');x.code=er.code;if(er.code==='SESSION'&&TOKEN&&action!=='logout')sair(true);throw x}
  return j.data}
async function push(a,d,ok){if(!ONLINE){if(ok)toast(ok);return null}try{const r=await api(a,d);if(ok)toast(ok);return r}catch(e){toast(e.message);return undefined}}
async function sair(expired){try{if(TOKEN&&!expired)await api('logout')}catch(e){}TOKEN=null;try{localStorage.removeItem(TK)}catch(e){}toLogin(expired?'Sessão expirada. Entre novamente.':'')}
function toLogin(msg){try{sessionStorage.setItem('zoe-msg',msg||'')}catch(e){}history.replaceState(null,'','#');location.reload()}
function showLogin(msg){READY=false;$('#layer').innerHTML='';$('#gate').innerHTML=`<div class="gate"><form class="gbox" onsubmit="return doLogin(event)">${logoImg(170)}<h1 style="font-size:28px">${esc(ZC.nomeIgreja||'Ministério Zoe')}</h1><p class="muted">Entre com o e-mail e a senha cadastrados pela igreja.</p>${msg?`<p class="chip r" role="alert">${esc(msg)}</p>`:''}<label class="f">E-mail<input id="lg_e" type="email" autocomplete="username" required></label><label class="f">Senha<input id="lg_s" type="password" autocomplete="current-password" required></label><button class="btn" id="lg_b">Entrar</button></form></div>`}
async function doLogin(ev){ev.preventDefault();const b=$('#lg_b');b.disabled=true;try{const r=await api('login',{email:$('#lg_e').value,senha:$('#lg_s').value});TOKEN=r.token;try{localStorage.setItem(TK,TOKEN)}catch(e){}if(r.trocarSenha)showForced();else boot()}catch(e){showLogin(e.message)}return false}
function showForced(){$('#gate').innerHTML=`<div class="gate"><form class="gbox" onsubmit="return doForced(event)"><h2>Crie sua senha</h2><p class="muted">Por segurança, troque a senha temporária antes de continuar.</p><label class="f">Senha temporária<input id="fp_a" type="password" required></label><label class="f">Nova senha (8 ou mais caracteres)<input id="fp_n" type="password" minlength="8" required></label><label class="f">Repita a nova senha<input id="fp_r" type="password" required></label><button class="btn">Salvar nova senha</button></form></div>`}
async function doForced(ev){ev.preventDefault();if($('#fp_n').value!==$('#fp_r').value)return toast('As senhas não são iguais'),false;try{await api('changePassword',{atual:$('#fp_a').value,nova:$('#fp_n').value});TOKEN=null;try{localStorage.removeItem(TK)}catch(e){}toLogin('Senha alterada. Entre com a nova senha.')}catch(e){toast(e.message)}return false}
async function boot(){$('#gate').innerHTML='<div class="gate"><p class="muted">Carregando…</p></div>';try{await hydrate();READY=true;$('#gate').innerHTML='';shell();render()}catch(e){if(e.code!=='SESSION')showLogin(e.message)}}
const dBR=iso=>iso?String(iso).slice(0,10).split('-').reverse().join('/'):'';
function fromMembro(m){const f=m.Filhos||[];return{nome:m.Nome,simples:m.Simples,sexo:m.Sexo,nasc:m.Nascimento,nacionalidade:m.Nacionalidade,natural:m.Naturalidade,sangue:m.Sangue,doador:m.Doador,prof:m.Profissao,tel:m.Telefone,email:m.Email,cep:m.CEP,uf:m.UF,cidade:m.Cidade,end:m.Endereco,bairro:m.Bairro,decisao:m.DataDecisao,batizado:m.Batizado,dataBat:m.DataBatismo,igrejaBat:m.IgrejaBatismo,mae:m.Mae,pai:m.Pai,civil:m.EstadoCivil||'Solteiro(a)',conj:m.Conjuge,dataCas:m.DataCasamento,filhos:f,temFilhos:f.length?'sim':'nao',acPriv:String(m.AceitePrivacidade||'').slice(0,10),acTermos:String(m.AceiteTermos||'').slice(0,10)}}
function toMembro(p){return{Nome:p.nome,Simples:p.simples,Apelido:S.apelido,Sexo:p.sexo,Nascimento:p.nasc,Nacionalidade:p.nacionalidade,Naturalidade:p.natural,Sangue:p.sangue,Doador:p.doador,Profissao:p.prof,Telefone:p.tel,CEP:p.cep,UF:p.uf,Cidade:p.cidade,Endereco:p.end,Bairro:p.bairro,DataDecisao:p.decisao,Batizado:p.batizado,DataBatismo:p.dataBat,IgrejaBatismo:p.igrejaBat,Mae:p.mae,Pai:p.pai,EstadoCivil:p.civil,Conjuge:p.conj,DataCasamento:p.dataCas,Foto:S.foto,Filhos:p.temFilhos==='sim'?p.filhos:[]}}
function pushMember(msg){return push('saveMember',{membro:toMembro(S.perfil)},msg)}
const mapM=m=>({id:m.id,n:m.nome,a:m.apelido,nasc:dBR(m.nasc),m:m.membro});
function mapEvents(l){EVENTOS.length=0;S.agenda=[];S.inscr=[];l.forEach((e,i)=>{if(e.escopo==='celula')S.agenda.push({d:e.data,t:e.titulo,h:e.hora,loc:e.local||'A definir',adm:false});else EVENTOS.push({id:i+1,sid:e.id,t:e.titulo,d:e.data,h:e.hora,loc:e.local,desc:e.descricao||'',prog:e.programacao||[]});if(e.inscrito)S.inscr.push(e.titulo)})}
function mapNews(l){NOTICIAS.length=0;l.forEach(n=>NOTICIAS.push({t:n.titulo,d:dBR(n.data),s:n.texto,r:0}))}
function mapCourses(cu){CURSOS.gerais=cu.map(c=>({id:c.id,nome:c.nome,status:c.status}));CURSOS.feitos=cu.filter(c=>c.status==='Concluido'||c.status==='Matriculado').map(c=>c.nome+(c.status==='Matriculado'?' (em andamento)':' (concluído)'));CURSOS.pend=cu.filter(c=>c.status==='Pendente').map(c=>c.nome+' (matrícula pendente)');S.cursosRoad=cu.filter(c=>c.status).map(c=>({t:(c.status==='Concluido'?'Concluiu o curso ':c.status==='Matriculado'?'Matriculado no curso ':'Matrícula pendente em ')+c.nome}))}
function mapLessons(l){LICOES.length=0;l.forEach(x=>LICOES.push({t:x.titulo,s:x.resumo,c:x.categoria||'Lição',u:x.url}))}
function mapDyn(d){DINAMICAS.length=0;S.minhasD=[];d.forEach(x=>{const o={t:x.titulo,s:x.descricao,min:x.minutos};x.membroId===S.membroId?S.minhasD.push(o):DINAMICAS.push(o)})}
function mapCells(l){CELULAS.length=0;l.forEach(c=>{const h=[...c.id].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7);CELULAS.push({n:c.nome,dia:c.dia,ini:c.inicio,fim:c.fim,cat:c.categoria,faixa:c.faixa,bairro:c.bairro,cid:c.cidade,uf:c.uf,lider:c.lider,x:12+h%76,y:15+(h>>>8)%66,tel:c.telefone,local:c.local})})}
function setHist(h){S.historico=h.reunioes.map(r=>({d:r.data,p:r.presentes,deus:r.deus}));S.ind=h.indicadores}
function mapPapeis(pp){S.papeis={};pp.forEach(x=>{const i=S.membros.findIndex(m=>m.id===x.membroId),j=PAPEIS.indexOf(x.papel);if(i>=0&&j>=0)S.papeis[i+'_'+j]=true})}
async function reloadMembros(){S.membros=(await api('cellMembers')).map(mapM)}
async function refreshCell(){if(!S.celulaId)return;setHist(await api('history'))}
async function hydrate(){
 const me=await api('me'),m=me.membro,c=me.config;
 S.role=me.usuario.papel;S.perm={};S.perm[S.role]=me.permissoes;S.membroId=m.MembroID;
 S.apelido=m.Apelido||m.Simples||String(m.Nome||'Membro').split(' ')[0];S.foto=m.Foto||'';S.perfil=fromMembro(m);
 S.yt=c.canalYoutube||YT_URL;S.whats=c.whatsapp||'';S.local=c.localEndereco||'';S.colunas=c.colunasExtras||[];
 const cel=me.celula;S.celulaId=cel?cel.id:'';
 S.cell=cel?{nome:cel.nome,desc:cel.descricao,foto:cel.foto,dia:cel.dia,inicio:cel.inicio,priv:cel.priv}:{nome:'Sem célula',desc:'',foto:'',dia:'',inicio:'',priv:{grupo:false,tel:false,email:false,end:false}};
 const[ev,mi,nw,vd,cu,li,di,an,sc,og]=await Promise.all([api('listEvents'),api('listMinistries'),api('listNews'),api('listVideos'),api('listCourses'),api('listLessons'),api('listDynamics'),api('birthdays'),api('searchCells'),api('orgTree')]);
 mapEvents(ev);S.ministerios=mi.map(x=>x.nome);S.minIds=mi.map(x=>x.id);mapNews(nw);S.videos=vd.map(x=>({t:x.titulo,u:x.url,id:x.id}));mapCourses(cu);mapLessons(li);mapDyn(di);S.aniv=an;mapCells(sc);S.org=og;
 S.membros=[];S.historico=[];S.ind=null;S.papeis={};S.oracoes=[];S.indC=[];S.indE=[];S.transf=[];
 if(cel){const[mb,h,pp,or,ind]=await Promise.all([api('cellMembers'),api('history'),api('getPapeis'),api('listPrayers'),api('indicators')]);S.membros=mb.map(mapM);setHist(h);mapPapeis(pp);S.oracoes=or.map(o=>({tema:o.tema,t:o.titulo,x:o.texto}));S.indC=Object.entries(ind.cursos).map(([k,v])=>[k,v.join(', ')]);S.indE=Object.entries(ind.eventos).map(([k,v])=>[k,v.join(', ')])}
 if(me.permissoes.transf){S.transf=(await api('listTransfers')).map(x=>({id:x.id,n:x.nome,de:x.de,para:x.para,st:x.status}))}
 if(me.permissoes.config){S.perm=await api('getPerms')}
 save()}
function renderKeep(){const v={};document.querySelectorAll('#view [id]').forEach(el=>{if('value' in el)v[el.id]=el.value});const y=scrollY;render();Object.keys(v).forEach(id=>{const el=document.getElementById(id);if(el&&el.tagName!=='BUTTON'&&v[id]!==undefined&&!el.value)el.value=v[id]});scrollTo(0,y)}

let ADM={tipo:'',d:null,busca:''};
const ADM_T=[['celulas','Células','celulas'],['eventos','Eventos','eventos'],['noticias','Notícias','eventos'],['ministerios','Ministérios','min'],['cursos','Cursos','config'],['licoes','Lições / Extras','config'],['dinamicas','Dinâmicas','config'],['videos','Vídeos','config']];
function editarTudoCard(){const ts=ADM_T.filter(t=>can(t[2]));if(!ts.length)return '';
 let b='';
 if(ADM.d){const q=ADM.busca.toLowerCase();const it=ADM.d.itens.filter(i=>!q||(i.rotulo+' '+i.sub).toLowerCase().includes(q));
  b=`<div class="row"><input id="adq" placeholder="Buscar" value="${esc(ADM.busca)}" oninput="ADM.busca=this.value;admLista()" style="flex:1"><button class="btn" onclick="admForm('')">${ic('plus',16)} Novo</button></div><div id="adl">${admItens(it)}</div>`}
 else if(ADM.tipo)b='<p class="muted sm">Carregando…</p>';
 else b='<p class="muted sm">Escolha o que deseja ver ou editar.</p>';
 return `<div class="card flat col"><h3>Editar tudo que foi criado</h3><div class="tabs">${ts.map(t=>`<button class="${ADM.tipo===t[0]?'on':''}" onclick="admAbrir('${t[0]}')">${t[1]}</button>`).join('')}</div>${b}</div>`}
function admItens(it){return it.length?it.map(i=>`<div class="opt" style="${i.off?'opacity:.55':''}"><div style="flex:1;min-width:0"><b>${esc(i.rotulo)}</b>${i.off?' <span class="chip r">inativo</span>':''}<div class="muted sm">${esc(i.sub||'')}</div></div><button class="btn sm ghost" data-id="${esc(i.id)}" onclick="admForm(this.dataset.id)">${ic('pen',14)} Editar</button><button class="btn sm ${i.off?'':'red'}" data-id="${esc(i.id)}" onclick="admRem(this.dataset.id,${i.off?1:0})">${ADM.d.podeApagar?'Apagar':i.off?'Reativar':'Remover'}</button></div>`).join(''):'<p class="muted sm">Nada cadastrado ainda.</p>'}
function admLista(){const q=ADM.busca.toLowerCase();const el=$('#adl');if(el)el.innerHTML=admItens(ADM.d.itens.filter(i=>!q||(i.rotulo+' '+i.sub).toLowerCase().includes(q)))}
async function admAbrir(t){ADM={tipo:t,d:null,busca:''};renderKeep();await admCarregar()}
async function admCarregar(){try{ADM.d=await api('adminList',{tipo:ADM.tipo});renderKeep()}catch(e){toast(e.message);ADM.tipo='';renderKeep()}}
function admForm(id){const D=ADM.d,it=id?D.itens.find(i=>i.id===id):null,v=it?it.valores:{};
 const inp=(f,i)=>{const val=v[f.k]??'',n='adf'+i;
  if(f.t==='area'||f.t==='lines')return `<label class="f full">${esc(f.l)}<textarea id="${n}">${esc(val)}</textarea></label>`;
  if(f.t==='membro')return `<label class="f">${esc(f.l)}<select id="${n}"><option value="">—</option>${D.membros.map(m=>`<option value="${esc(m.id)}" ${m.id===val?'selected':''}>${esc(m.nome)}</option>`).join('')}</select></label>`;
  if(f.t==='sel')return `<label class="f">${esc(f.l)}<select id="${n}">${f.t==='sel'&&!f.op.some(o=>String(Array.isArray(o)?o[0]:o)===val)?'<option value="">—</option>':''}${f.op.map(o=>{const a=Array.isArray(o)?o:[o,o];return `<option value="${esc(a[0])}" ${a[0]===val?'selected':''}>${esc(a[1])}</option>`}).join('')}</select></label>`;
  const ty={date:'date',time:'time',num:'number',url:'url'}[f.t]||'text';
  return `<label class="f">${esc(f.l)}<input id="${n}" type="${ty}" value="${esc(val)}" ${f.max?`maxlength="${f.max}"`:''}></label>`};
 modal(`<h2>${it?'Editar':'Novo'}: ${esc(D.titulo)}</h2><div class="form">${D.campos.map(inp).join('')}</div><div class="row"><button class="btn" data-id="${esc(id)}" onclick="admSalvar(this.dataset.id)">Salvar</button><button class="btn ghost" onclick="closeL()">Cancelar</button></div>`)}
async function admSalvar(id){const valores={};ADM.d.campos.forEach((f,i)=>{valores[f.k]=document.getElementById('adf'+i).value});
 const r=await push('adminSave',{tipo:ADM.tipo,id:id||undefined,valores},id?'Alterações salvas':'Criado com sucesso');if(r===undefined)return;closeL();await admCarregar();await hydrate();render()}
async function admRem(id,off){const it=ADM.d.itens.find(i=>i.id===id);if(!ADM.d.podeApagar&&off){}else if(!confirm((ADM.d.podeApagar?'Apagar':'Remover')+' "'+(it?it.rotulo:'')+'"?'))return;
 const r=await push('adminRemove',{tipo:ADM.tipo,id,reativar:!!off&&!ADM.d.podeApagar},'Feito');if(r===undefined)return;await admCarregar();await hydrate();render()}
async function loadAdmin(){try{if(can('config'))S.users=await api('listUsers');if(can('min'))S.interests=await api('listInterests');renderKeep()}catch(e){toast(e.message)}}

  document.body.classList.toggle('collapsed',!!S.collapsed);

  <div class="nm"><input id="apelido" value="${esc(S.apelido)}" maxlength="24" aria-label="Apelido" onchange="setApelido(this.value)"><small>Toque para mudar o apelido</small></div></div>
  <nav class="nav">${nav.map(([r,i,l])=>`<button class="nv ${R.r===r?'on':''}" onclick="go('${r}')">${ic(i)}<span>${l}</span></button>`).join('')}</nav>
  <div class="side-foot">${ONLINE?`<span>${esc(ROLE_N[S.role]||'')}</span><button class="btn ghost sm" onclick="sair()">Sair</button>`:`<label class="f">Ver como (teste de permissões)<select onchange="setRole(this.value)">${ROLES.map(([v,l])=>`<option value="${v}" ${S.role===v?'selected':''}>${l}</option>`).join('')}</select></label>`}</div>`;
  $('#bm').innerHTML=ic('menu');$('#bc').innerHTML=ic(S.collapsed?'chevr':'chev');
  $('#ba').innerHTML=ic('spark');$('#ba').style.color=S.anim?'var(--verde)':'var(--muted)';
  const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!S.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
  $('#bt').innerHTML=ic(dark?'sun':'moon');

  <div class="grid w">${fl.map(c=>`<div class="card col"><div class="row"><h3 class="sp">${esc(c.n)}</h3><span class="chip">${esc(c.cat)}</span></div><p class="muted sm">${esc(c.dia)} · ${esc(c.ini)} às ${esc(c.fim)} · ${esc(c.faixa)}</p><p>${ic('pin',14)} ${esc(c.local||`${c.bairro}, ${c.cid} - ${c.uf}`)}</p>${c.tel?`<p class="sm">${ic('phone',14)} ${esc(c.tel)}</p>`:''}<a class="btn sm ghost" style="align-self:flex-start" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.local||(c.bairro+', '+c.cid+' '+c.uf))}">Ver no Google Maps</a></div>`).join('')||'<p class="muted">Nenhuma célula com esses filtros.</p>'}</div>`},

function redim(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.onerror=()=>toast('Não foi possível ler a imagem');im.src=r.result};r.readAsDataURL(f)}

function calendario(){const base=new Date(HOJE.getFullYear(),HOJE.getMonth()+(R.co||0),1),y=base.getFullYear(),m=base.getMonth();const prim=base.getDay(),n=new Date(y,m+1,0).getDate();const ag=S.agenda.concat(EVENTOS.map(e=>({d:e.d,t:e.t,h:e.h,loc:e.loc,adm:true})));
 const sel=R.cd||TODAY;let cells=['D','S','T','Q','Q','S','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<span></span>'.repeat(prim);
 for(let d=1;d<=n;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const ev=ag.filter(a=>a.d===k);cells+=`<button class="${k===sel?'sel':''} ${k===TODAY?'hoje':''}" onclick="R.cd='${k}';render()">${d}<span class="dots">${ev.map(e=>`<i class="${e.adm?'a':''}"></i>`).join('')}</span></button>`}

 <div class="card flat col"><h3>${fmt(sel)}</h3>${day.map(e=>`<div class="opt"><span class="mini" style="background:${e.adm?'var(--vermelho)':'var(--verde)'}">${ic('cal',16)}</span><div><b>${esc(e.t)}</b><div class="muted sm">${esc(e.h)} · ${esc(e.loc)}</div></div></div>`).join('')||'<p class="muted sm">Nada agendado neste dia.</p>'}

function presenca(){const P=R.pres||{};
 let b=`<div class="card flat col"><h2>Presença: adicionar pessoa</h2><div class="row"><input id="pq" placeholder="Nome da pessoa" value="${esc(P.q||'')}" style="flex:1"><button class="btn" onclick="buscaP()">${ic('search',16)} Verificar</button></div></div>`;
 if(P.res==='sem')b+=`<div class="card flat col"><span class="chip">${esc(P.q)} ainda não está em nenhuma célula</span><p>Deseja incluir na sua célula?</p><div class="row"><button class="btn" onclick="pedeT()">Incluir na minha célula</button><button class="btn ghost" onclick="R.pres=null;render()">Não</button></div></div>`;
 if(P.res==='aqui')b+=`<div class="card flat"><span class="chip">Já faz parte da ${esc(S.cell.nome)}</span></div>`;

 if(P.res==='novo')b+=`<div class="card flat col"><h3>Cadastro de novo membro</h3><div class="form"><label class="f">Nome<input id="nn" value="${esc(P.q)}"></label><label class="f">Endereço<input id="ne"></label><label class="f">Número de celular<input id="nc" inputmode="tel"></label>${S.colunas.map((c,i)=>`<label class="f">${esc(c)}<input class="xc"></label>`).join('')}</div><div><button class="btn" onclick="cadNovo()">Cadastrar e marcar presença</button></div></div>`;
 if(S.transf.length)b+=`<div class="card flat col"><h3>Pedidos enviados</h3>${S.transf.map(t=>`<div class="opt"><div>${esc(t.n)}<div class="muted sm">${esc(t.de)} para ${esc(t.para)}</div></div><span class="chip ${t.st==='negado'?'r':''}">${t.st}</span></div>`).join('')}</div>`;return b}

async function addV(){const t=$('#vt').value.trim(),u=$('#vu').value.trim();if(!t||!/^https:\/\//.test(u))return toast('Informe título e link https');const r=await push('saveVideo',{titulo:t,url:u});if(r===undefined)return;if(ONLINE){S.videos=(await api('listVideos')).map(x=>({t:x.titulo,u:x.url,id:x.id}))}else S.videos.push({t,u});save();render()}
async function addEv(){const t=$('#ev1').value.trim(),d=$('#ev2').value;if(!t||!d)return toast('Informe nome e data');const o={titulo:t,data:d,hora:$('#ev3').value||'19:00',local:$('#ev4').value||'A definir'};const r=await push('createEvent',o);if(r===undefined)return;if(ONLINE)mapEvents(await api('listEvents'));else EVENTOS.push({id:EVENTOS.length+1,t,d,h:o.hora,loc:o.local,desc:'Evento lançado pela administração.',prog:[]});toast('Evento publicado');render()}

/* ---------- mural ---------- */
const M={mode:'mover',tool:'pincel',color:'#FFFFFF',size:5};
const STK={star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor"/>',heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z" fill="currentColor"/>',circle:'<circle cx="12" cy="12" r="9" fill="currentColor"/>',cross:'<path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z" fill="currentColor"/>'};
function muralHTML(){const cols=['#FFFFFF','#FFD54A','#E23B3B','#2FBF74','#6EC1FF'];
 return `<div class="card flat col"><div class="row"><b class="sp">Mural da célula</b><button class="btn sm ${M.mode==='mover'?'':'ghost'}" onclick="mMode('mover')">Mover itens</button><button class="btn sm ${M.mode==='desenhar'?'':'ghost'}" onclick="mMode('desenhar')">Desenhar</button></div>
 <div class="row">${['pincel','giz','borracha'].map(t=>`<button class="btn sm ${M.tool===t?'':'ghost'}" onclick="M.tool='${t}';M.mode='desenhar';render()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}${cols.map(c=>`<button class="ib" style="width:30px;height:30px;background:${c};${M.color===c?'outline:3px solid var(--vermelho)':''}" onclick="M.color='${c}';render()" aria-label="Cor ${c}"></button>`).join('')}<input type="range" min="2" max="24" value="${M.size}" style="width:110px" onchange="M.size=+this.value" aria-label="Espessura"></div>
 <div class="row"><span class="sm muted">Adesivos:</span>${Object.keys(STK).map(k=>`<button class="ib" style="width:36px;height:36px" onclick="addSt('${k}')" aria-label="Adesivo ${k}"><svg width="20" height="20" viewBox="0 0 24 24" style="color:var(--vermelho)">${STK[k]}</svg></button>`).join('')}<label class="btn sm ghost">${ic('image',16)} Foto<input type="file" accept="image/*" hidden onchange="addFoto(this)"></label><button class="btn sm ghost" onclick="limpar()">Limpar desenho</button></div>
 <div class="board" id="board">${S.muralItems.map(itHTML).join('')}<canvas id="cv" class="${M.mode==='desenhar'?'on':''}"></canvas></div></div>`}
function itHTML(i){return i.t==='p'?`<div class="it2 polar" data-id="${i.id}" style="left:${i.x}px;top:${i.y}px;transform:rotate(${i.r}deg)"><div class="im" style="background:${i.img?`url('${i.img}')`:`linear-gradient(135deg,${i.c},#0F6F3E)`};background-size:cover;background-position:center"></div>${esc(i.l)}</div>`:`<div class="it2" data-id="${i.id}" style="left:${i.x}px;top:${i.y}px;color:${i.c};transform:rotate(${i.r}deg)"><svg width="54" height="54" viewBox="0 0 24 24">${STK[i.k]}</svg></div>`}
function mMode(m){M.mode=m;render()}
function addSt(k){S.muralItems.push({id:Date.now(),t:'s',x:60+Math.random()*180,y:60+Math.random()*200,r:Math.round(Math.random()*30-15),k,c:['#FFD54A','#E23B3B','#2FBF74','#6EC1FF'][Math.floor(Math.random()*4)]});save();render()}
function addFoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.muralItems.push({id:Date.now(),t:'p',x:50+Math.random()*120,y:40+Math.random()*120,r:Math.round(Math.random()*12-6),l:'Nova foto',img:r.result,c:'#1E9E5A'});save();render()};r.readAsDataURL(f)}
function setPapel(k,v){S.papeis[k]=v;save();if(!ONLINE)return;clearTimeout(window._pp);window._pp=setTimeout(()=>{const it=[];Object.keys(S.papeis).forEach(key=>{if(!S.papeis[key])return;const[i,j]=key.split('_').map(Number);if(S.membros[i]&&S.membros[i].id)it.push({membroId:S.membros[i].id,papel:PAPEIS[j]})});push('savePapeis',{itens:it},'Papéis salvos')},700)}
function salvarCelula(){S.cell.nome=$('#cn').value;S.cell.desc=$('#cd').value;save();shell();push('saveCell',{nome:S.cell.nome,descricao:S.cell.desc},'Perfil da célula salvo')}
function togPriv(k){S.cell.priv[k]=!S.cell.priv[k];save();render();push('saveCell',{priv:S.cell.priv})}
function limpar(){S.mural=null;save();render()}
function muralInit(){const b=$('#board'),c=$('#cv');if(!b||!c)return;c.width=b.clientWidth;c.height=b.clientHeight;const x=c.getContext('2d');
 if(S.mural){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=S.mural}
 let d=false,lx=0,ly=0;const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 c.onpointerdown=e=>{if(M.mode!=='desenhar')return;d=true;[lx,ly]=pos(e);c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(!d)return;const[px,py]=pos(e);x.lineCap='round';x.lineJoin='round';
  if(M.tool==='borracha'){x.globalCompositeOperation='destination-out';x.lineWidth=M.size*3;x.globalAlpha=1}else{x.globalCompositeOperation='source-over';x.strokeStyle=M.color;x.lineWidth=M.size;x.globalAlpha=M.tool==='giz'?.55:1}
  x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();
  if(M.tool==='giz'){x.fillStyle=M.color;for(let i=0;i<4;i++)x.fillRect(px+(Math.random()-.5)*M.size*1.6,py+(Math.random()-.5)*M.size*1.6,1.5,1.5)}
  lx=px;ly=py};
 const end=()=>{if(!d)return;d=false;try{S.mural=c.toDataURL();save()}catch(e){}};c.onpointerup=end;c.onpointercancel=end;
 b.querySelectorAll('.it2').forEach(el=>{el.onpointerdown=e=>{if(M.mode!=='mover')return;e.preventDefault();const id=+el.dataset.id,it=S.muralItems.find(z=>z.id===id);const sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y;el.setPointerCapture(e.pointerId);
  el.onpointermove=ev=>{it.x=ox+ev.clientX-sx;it.y=oy+ev.clientY-sy;el.style.left=it.x+'px';el.style.top=it.y+'px'};
  el.onpointerup=()=>{el.onpointermove=null;el.onpointerup=null;save()}}})}

/* ---------- início ---------- */
(function(){const h=(location.hash||'').slice(1);if(VIEWS[h])R.r=h})();
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(READY&&VIEWS[h]&&h!==R.r){R.r=h;shell();render()}});
if(ONLINE){if(TOKEN)boot();else{let m='';try{m=sessionStorage.getItem('zoe-msg')||'';sessionStorage.removeItem('zoe-msg')}catch(e){}showLogin(m)}}else{shell();render()}
</script>
